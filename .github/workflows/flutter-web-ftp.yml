name: Build & Deploy Flutter Web (FTP)

on:
  push:
    branches: [ "release" ]   # change if needed
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Restore packages
        run: flutter pub get

      - name: Analyze & Test
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build Web (base-href /web/)
        run: flutter build web --release --base-href "/web/"

      # The app compares app_version.json with its own version and reloads
      # when it is out of date. ?v= on the JS files makes every release a new
      # URL, so browsers can't serve last release's cached copy.
      - name: Version stamp & cache busting
        run: |
          V=$(grep -oE "(major|minor|patch) = '[0-9]+'" lib/config/app_version.dart | grep -oE "[0-9]+" | paste -sd. -)
          echo "App version: $V"
          echo "{\"version\":\"$V\"}" > build/web/app_version.json
          sed -i "s/\"main.dart.js\"/\"main.dart.js?v=$V\"/g" build/web/flutter_bootstrap.js
          sed -i "s/flutter_bootstrap.js\"/flutter_bootstrap.js?v=$V\"/" build/web/index.html
          grep -q "main.dart.js?v=$V" build/web/flutter_bootstrap.js
          grep -q "flutter_bootstrap.js?v=$V" build/web/index.html
          printf '%s\n' \
            '<IfModule mod_headers.c>' \
            '  <FilesMatch "\.(html|js|json)$">' \
            '    Header set Cache-Control "no-cache"' \
            '  </FilesMatch>' \
            '</IfModule>' > build/web/.htaccess

      - name: Upload artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
  
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web/

      # Drop a marker so you can find it via FTP/search
      - name: Add deploy marker
        run: echo "run=${GITHUB_RUN_NUMBER} $(date -u)" > build/web/__DEPLOY_MARKER.txt

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp              # use 'ftps' or 'sftp' if your host supports it
          local-dir: build/web/
          server-dir: events.motion.rs/public/web/  #${{ secrets.FTP_REMOTE_DIR }}  # e.g. /public_html/web
          state-name: .deploy-state.json
          exclude: |
            **/.DS_Store
            **/Thumbs.db
